allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Plugins (p. ej. app_links) usan flutter.compileSdkVersion antes de que :app evalúe.
gradle.beforeProject { project ->
    if (project.name != "app" && project != project.rootProject) {
        project.ext.flutter = [
            compileSdkVersion: 36,
            minSdkVersion: 23,
            targetSdkVersion: 36,
            ndkVersion: "26.1.10909125",
        ]
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
